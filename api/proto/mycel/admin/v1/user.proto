syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/timestamp.proto";


// AdminUserService manages standard users. System admins/operators are a
// separate principal type and are not created through this service.
service AdminUserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc FindUser(FindUserRequest) returns (FindUserResponse);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse);
  rpc EnableUser(EnableUserRequest) returns (EnableUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse);

  rpc CreateUserSession(CreateUserSessionRequest) returns (CreateUserSessionResponse);
  rpc ListUserSessions(ListUserSessionsRequest) returns (ListUserSessionsResponse);
  rpc RevokeUserSession(RevokeUserSessionRequest) returns (RevokeUserSessionResponse);
  rpc RevokeUserSessions(RevokeUserSessionsRequest) returns (RevokeUserSessionsResponse);
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
  bool include_deleted = 4;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message FindUserRequest {
  string username = 1;
}

message FindUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string username = 1;

  // Optional initial password. Password plaintext is never returned and must be
  // hashed by the daemon before storage.
  optional string password = 2;

  // When true, the user is created disabled and cannot log in until enabled.
  bool disabled = 3;
}

message CreateUserResponse {
  User user = 1;
}

message DisableUserRequest {
  string user_id = 1;
  string reason = 2;
  bool revoke_sessions = 3;
}

message DisableUserResponse {
  User user = 1;
}

message EnableUserRequest {
  string user_id = 1;
}

message EnableUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
  bool revoke_sessions = 2;
}

message DeleteUserResponse {
  User user = 1;
}

message SetUserPasswordRequest {
  string user_id = 1;
  string password = 2;
  bool revoke_sessions = 3;
}

message SetUserPasswordResponse {
  User user = 1;
}

message CreateUserSessionRequest {
  string user_id = 1;
  AdminClientInfo client = 2;
}

message CreateUserSessionResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
  optional string refresh_token = 3;
  User user = 4;
  string auth_session_id = 5;
}

message ListUserSessionsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  bool include_inactive = 4;
}

message ListUserSessionsResponse {
  repeated AdminAuthSessionSummary sessions = 1;
  string next_page_token = 2;
}

message RevokeUserSessionRequest {
  string user_id = 1;
  string auth_session_id = 2;
}

message RevokeUserSessionResponse {}

message RevokeUserSessionsRequest {
  string user_id = 1;
}

message RevokeUserSessionsResponse {
  int32 revoked_count = 1;
}

message User {
  string user_id = 1;
  string username = 2;
  UserState state = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
}

enum UserState {
  USER_STATE_UNSPECIFIED = 0;
  USER_STATE_ACTIVE = 1;
  USER_STATE_DISABLED = 2;
  USER_STATE_DELETED = 3;
}

message AdminAuthSessionSummary {
  string auth_session_id = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp last_seen_time = 3;
  google.protobuf.Timestamp expire_time = 4;
  AdminAuthSessionState state = 5;
  AdminClientInfo client = 6;
}

enum AdminAuthSessionState {
  ADMIN_AUTH_SESSION_STATE_UNSPECIFIED = 0;
  ADMIN_AUTH_SESSION_STATE_ACTIVE = 1;
  ADMIN_AUTH_SESSION_STATE_EXPIRED = 2;
  ADMIN_AUTH_SESSION_STATE_REVOKED = 3;
}

message AdminClientInfo {
  string name = 1;
  string version = 2;
  string platform = 3;
  string device_label = 4;
}
