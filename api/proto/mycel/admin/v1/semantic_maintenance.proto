syntax = "proto3";

package mycel.admin.v1;

option go_package = "github.com/myceldb/mycel/gen/go/mycel/admin/v1;adminv1";

// AdminSemanticMaintenanceService runs daemon-owned semantic maintenance work.
service AdminSemanticMaintenanceService {
  rpc AnalyzeSemanticDirtyWork(AnalyzeSemanticDirtyWorkRequest) returns (AnalyzeSemanticDirtyWorkResponse);
  rpc ProcessSemanticDirtyWork(ProcessSemanticDirtyWorkRequest) returns (ProcessSemanticDirtyWorkResponse);
  rpc BackfillSemanticIndex(BackfillSemanticIndexRequest) returns (BackfillSemanticIndexResponse);
}

message AnalyzeSemanticDirtyWorkRequest {
  string space_id = 1;
  string semantic_index_id = 2;
  int32 limit = 3;
}

message AnalyzeSemanticDirtyWorkResponse {
  int32 processed_events = 1;
  int32 enqueued_items = 2;
}

message ProcessSemanticDirtyWorkRequest {
  string space_id = 1;
  int32 limit = 2;
}

message ProcessSemanticDirtyWorkResponse {
  int32 processed_items = 1;
  int32 completed_items = 2;
  int32 failed_items = 3;
}

message BackfillSemanticIndexRequest {
  string space_id = 1;
  string semantic_index_id = 2;
  repeated string node_ids = 3;
  bool force = 4;
  int32 limit = 5;
  bool continue_on_error = 6;
}

message BackfillSemanticIndexResponse {
  string semantic_index_id = 1;
  int32 selected_count = 2;
  int32 generated_count = 3;
  int32 skipped_count = 4;
  int32 failed_count = 5;
  repeated BackfillSkipped skipped = 6;
  repeated BackfillFailure failures = 7;
}

message BackfillSkipped {
  string node_id = 1;
  string reason = 2;
}

message BackfillFailure {
  string node_id = 1;
  string error = 2;
}
