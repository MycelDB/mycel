syntax = "proto3";

package mycel.admin.v1;

import "mycel/client/v1/space.proto";
import "mycel/common/v1/access.proto";


// AdminSpaceService manages daemon spaces through the operator-facing Admin API.
service AdminSpaceService {
  rpc ListSpaces(AdminSpaceServiceListSpacesRequest) returns (AdminSpaceServiceListSpacesResponse);
  rpc GetSpace(AdminSpaceServiceGetSpaceRequest) returns (AdminSpaceServiceGetSpaceResponse);
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  rpc GrantSpaceUser(GrantSpaceUserRequest) returns (GrantSpaceUserResponse);
}

message AdminSpaceServiceListSpacesRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_archived = 3;
}

message AdminSpaceServiceListSpacesResponse {
  repeated mycel.client.v1.Space spaces = 1;
  string next_page_token = 2;
}

message AdminSpaceServiceGetSpaceRequest {
  string space_id = 1;
}

message AdminSpaceServiceGetSpaceResponse {
  mycel.client.v1.Space space = 1;
}

message CreateSpaceRequest {
  string name = 1;
  string owner_user_id = 2;
  string owner_username = 3;
  string default_domain_key = 4;
  string default_domain_name = 5;
}

message CreateSpaceResponse {
  mycel.client.v1.Space space = 1;
  string default_domain_id = 2;
}

message DeleteSpaceRequest {
  string space_id = 1;
}

message DeleteSpaceResponse {}

message GrantSpaceUserRequest {
  string space_id = 1;
  string user_id = 2;
  string username = 3;
  mycel.common.v1.SpaceRole role = 4;
}

message GrantSpaceUserResponse {
  mycel.common.v1.AccessGrant grant = 1;
}
