syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mycel/common/v1/access.proto";


// AdminOperatorService manages system admins/operators. Operators are distinct
// from standard users and are not created through AdminUserService.
service AdminOperatorService {
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse);
  rpc FindOperator(FindOperatorRequest) returns (FindOperatorResponse);

  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse);
  rpc UpdateOperator(UpdateOperatorRequest) returns (UpdateOperatorResponse);

  rpc DisableOperator(DisableOperatorRequest) returns (DisableOperatorResponse);
  rpc EnableOperator(EnableOperatorRequest) returns (EnableOperatorResponse);
  rpc DeleteOperator(DeleteOperatorRequest) returns (DeleteOperatorResponse);

  rpc SetOperatorPassword(SetOperatorPasswordRequest) returns (SetOperatorPasswordResponse);

  rpc ListOperatorRoles(ListOperatorRolesRequest) returns (ListOperatorRolesResponse);
  rpc GrantOperatorRole(GrantOperatorRoleRequest) returns (GrantOperatorRoleResponse);
  rpc RevokeOperatorRole(RevokeOperatorRoleRequest) returns (RevokeOperatorRoleResponse);

  rpc ListOperatorCapabilities(ListOperatorCapabilitiesRequest) returns (ListOperatorCapabilitiesResponse);
  rpc GrantOperatorCapability(GrantOperatorCapabilityRequest) returns (GrantOperatorCapabilityResponse);
  rpc RevokeOperatorCapability(RevokeOperatorCapabilityRequest) returns (RevokeOperatorCapabilityResponse);

  rpc ListOperatorSessions(ListOperatorSessionsRequest) returns (ListOperatorSessionsResponse);
  rpc RevokeOperatorSession(RevokeOperatorSessionRequest) returns (RevokeOperatorSessionResponse);
  rpc RevokeOperatorSessions(RevokeOperatorSessionsRequest) returns (RevokeOperatorSessionsResponse);
}

message ListOperatorsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
  bool include_deleted = 4;
}

message ListOperatorsResponse {
  repeated Operator operators = 1;
  string next_page_token = 2;
}

message GetOperatorRequest {
  string operator_id = 1;
}

message GetOperatorResponse {
  Operator operator = 1;
}

message FindOperatorRequest {
  oneof lookup {
    string username = 1;
    string email = 2;
  }
}

message FindOperatorResponse {
  Operator operator = 1;
}

message CreateOperatorRequest {
  string username = 1;
  string display_name = 2;
  string email = 3;

  // Optional initial password. Password plaintext is never returned and must be
  // hashed by the daemon before storage.
  optional string password = 4;

  // Initial built-in operator role grants.
  repeated OperatorRole roles = 5;

  // Optional precise capability grants in addition to roles.
  repeated InitialOperatorCapabilityGrant capability_grants = 6;

  // When true, the operator is created disabled and cannot log in until enabled.
  bool disabled = 7;
}

message CreateOperatorResponse {
  Operator operator = 1;
  repeated OperatorRoleGrant role_grants = 2;
  repeated OperatorCapabilityGrant capability_grants = 3;
  repeated mycel.common.v1.Capability effective_capabilities = 4;
}

message UpdateOperatorRequest {
  Operator operator = 1;

  // Mutable paths are limited to "display_name" and "email" in v1. Username is
  // immutable in v1.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateOperatorResponse {
  Operator operator = 1;
}

message DisableOperatorRequest {
  string operator_id = 1;
  string reason = 2;
  bool revoke_sessions = 3;
}

message DisableOperatorResponse {
  Operator operator = 1;
}

message EnableOperatorRequest {
  string operator_id = 1;
}

message EnableOperatorResponse {
  Operator operator = 1;
}

message DeleteOperatorRequest {
  string operator_id = 1;
  bool revoke_sessions = 2;
}

message DeleteOperatorResponse {
  Operator operator = 1;
}

message SetOperatorPasswordRequest {
  string operator_id = 1;
  string password = 2;
  bool revoke_sessions = 3;
}

message SetOperatorPasswordResponse {
  Operator operator = 1;
}

message ListOperatorRolesRequest {
  string operator_id = 1;
}

message ListOperatorRolesResponse {
  repeated OperatorRoleGrant grants = 1;
  repeated OperatorRole effective_roles = 2;
}

message GrantOperatorRoleRequest {
  string operator_id = 1;
  OperatorRole role = 2;
  mycel.common.v1.AccessScope scope = 3;
  string reason = 4;
}

message GrantOperatorRoleResponse {
  OperatorRoleGrant grant = 1;
  repeated mycel.common.v1.Capability effective_capabilities = 2;
}

message RevokeOperatorRoleRequest {
  string operator_id = 1;
  string role_grant_id = 2;
  string reason = 3;
}

message RevokeOperatorRoleResponse {
  repeated mycel.common.v1.Capability effective_capabilities = 1;
}

message ListOperatorCapabilitiesRequest {
  string operator_id = 1;
}

message ListOperatorCapabilitiesResponse {
  repeated OperatorCapabilityGrant grants = 1;
  repeated mycel.common.v1.Capability effective_capabilities = 2;
}

message GrantOperatorCapabilityRequest {
  string operator_id = 1;
  mycel.common.v1.Capability capability = 2;
  mycel.common.v1.AccessScope scope = 3;
  string reason = 4;
}

message GrantOperatorCapabilityResponse {
  OperatorCapabilityGrant grant = 1;
  repeated mycel.common.v1.Capability effective_capabilities = 2;
}

message RevokeOperatorCapabilityRequest {
  string operator_id = 1;
  string capability_grant_id = 2;
  string reason = 3;
}

message RevokeOperatorCapabilityResponse {
  repeated mycel.common.v1.Capability effective_capabilities = 1;
}

message ListOperatorSessionsRequest {
  string operator_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  bool include_inactive = 4;
}

message ListOperatorSessionsResponse {
  repeated OperatorAuthSessionSummary sessions = 1;
  string next_page_token = 2;
}

message RevokeOperatorSessionRequest {
  string operator_id = 1;
  string auth_session_id = 2;
}

message RevokeOperatorSessionResponse {}

message RevokeOperatorSessionsRequest {
  string operator_id = 1;
}

message RevokeOperatorSessionsResponse {
  int32 revoked_count = 1;
}

message Operator {
  string operator_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  OperatorState state = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

enum OperatorState {
  OPERATOR_STATE_UNSPECIFIED = 0;
  OPERATOR_STATE_ACTIVE = 1;
  OPERATOR_STATE_DISABLED = 2;
  OPERATOR_STATE_DELETED = 3;
}

enum OperatorRole {
  OPERATOR_ROLE_UNSPECIFIED = 0;

  // Full daemon/system administration.
  OPERATOR_ROLE_SYSTEM_ADMIN = 1;

  // Can manage standard users.
  OPERATOR_ROLE_USER_ADMIN = 2;

  // Can create/archive/delete spaces and manage space-level admin operations.
  OPERATOR_ROLE_SPACE_ADMIN = 3;

  // Can configure semantic indexes, providers, credentials/policies,
  // maintenance, and backfill.
  OPERATOR_ROLE_SEMANTIC_ADMIN = 4;

  // Can inspect/manage storage, compaction, and disk maintenance.
  OPERATOR_ROLE_STORAGE_ADMIN = 5;

  // Can manage mesh membership/configuration.
  OPERATOR_ROLE_MESH_ADMIN = 6;

  // Can read audit events.
  OPERATOR_ROLE_AUDIT_READER = 7;
}

message InitialOperatorCapabilityGrant {
  mycel.common.v1.Capability capability = 1;
  mycel.common.v1.AccessScope scope = 2;
  string reason = 3;
}

message OperatorRoleGrant {
  string role_grant_id = 1;
  string operator_id = 2;
  OperatorRole role = 3;
  mycel.common.v1.AccessScope scope = 4;
  string reason = 5;
  string granted_by_operator_id = 6;
  google.protobuf.Timestamp create_time = 7;
}

message OperatorCapabilityGrant {
  string capability_grant_id = 1;
  string operator_id = 2;
  mycel.common.v1.Capability capability = 3;
  mycel.common.v1.AccessScope scope = 4;
  string reason = 5;
  string granted_by_operator_id = 6;
  google.protobuf.Timestamp create_time = 7;
}

message OperatorAuthSessionSummary {
  string auth_session_id = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp last_seen_time = 3;
  google.protobuf.Timestamp expire_time = 4;
  OperatorAuthSessionState state = 5;
  OperatorClientInfo client = 6;
}

enum OperatorAuthSessionState {
  OPERATOR_AUTH_SESSION_STATE_UNSPECIFIED = 0;
  OPERATOR_AUTH_SESSION_STATE_ACTIVE = 1;
  OPERATOR_AUTH_SESSION_STATE_EXPIRED = 2;
  OPERATOR_AUTH_SESSION_STATE_REVOKED = 3;
}

message OperatorClientInfo {
  string name = 1;
  string version = 2;
  string platform = 3;
  string device_label = 4;
}
