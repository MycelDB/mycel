syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/timestamp.proto";
import "mycel/admin/v1/operator.proto";


// AdminAuthService authenticates daemon operators/admins and issues short-lived
// access tokens for protected Admin API calls.
service AdminAuthService {
  // LoginOperator authenticates an operator and creates a durable operator auth session.
  rpc LoginOperator(LoginOperatorRequest) returns (LoginOperatorResponse);

  // RefreshOperator rotates a refresh token/session and returns a new short-lived
  // access token.
  rpc RefreshOperator(RefreshOperatorRequest) returns (RefreshOperatorResponse);

  // LogoutOperator revokes the current operator auth session, or the supplied
  // session when the caller is authorized to revoke it.
  rpc LogoutOperator(LogoutOperatorRequest) returns (LogoutOperatorResponse);

  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

message LoginOperatorRequest {
  string username = 1;
  string password = 2;
  OperatorClientInfo client = 3;
}

message LoginOperatorResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
  Operator operator = 3;

  // Optional for non-browser/service connectors. Browser transports should prefer
  // an HttpOnly refresh cookie set by the HTTP layer.
  optional string refresh_token = 4;
}

message RefreshOperatorRequest {
  // Optional because browser transports may provide the refresh token via an
  // HttpOnly cookie.
  optional string refresh_token = 1;
  OperatorClientInfo client = 2;
}

message RefreshOperatorResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
  Operator operator = 3;

  // Optional for non-browser/service connectors. Browser transports should prefer
  // an HttpOnly refresh cookie set by the HTTP layer.
  optional string refresh_token = 4;
}

message LogoutOperatorRequest {
  // If omitted, the daemon revokes the current operator auth session from request
  // context, refresh-token context, or cookie context.
  optional string auth_session_id = 1;
}

message LogoutOperatorResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  Operator operator = 1;
}
