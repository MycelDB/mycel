syntax = "proto3";

package mycel.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";


// AdminInferenceService manages daemon inference catalog/configuration resources
// used by AdminSemanticService and Client SemanticService.
service AdminInferenceService {
  rpc ApplyInferencePackage(AdminInferenceServiceApplyInferencePackageRequest) returns (AdminInferenceServiceApplyInferencePackageResponse);
  rpc ListInferencePackages(AdminInferenceServiceListInferencePackagesRequest) returns (AdminInferenceServiceListInferencePackagesResponse);
  rpc ListModelEndpoints(AdminInferenceServiceListModelEndpointsRequest) returns (AdminInferenceServiceListModelEndpointsResponse);
  rpc ListModels(AdminInferenceServiceListModelsRequest) returns (AdminInferenceServiceListModelsResponse);
  rpc ListVectorStores(AdminInferenceServiceListVectorStoresRequest) returns (AdminInferenceServiceListVectorStoresResponse);
  rpc ListModelEndpointCapabilities(AdminInferenceServiceListModelEndpointCapabilitiesRequest) returns (AdminInferenceServiceListModelEndpointCapabilitiesResponse);
  rpc CreateCredential(AdminInferenceServiceCreateCredentialRequest) returns (AdminInferenceServiceCreateCredentialResponse);
  rpc ListCredentials(AdminInferenceServiceListCredentialsRequest) returns (AdminInferenceServiceListCredentialsResponse);
  rpc CreateCredentialGrant(AdminInferenceServiceCreateCredentialGrantRequest) returns (AdminInferenceServiceCreateCredentialGrantResponse);
  rpc ListCredentialGrants(AdminInferenceServiceListCredentialGrantsRequest) returns (AdminInferenceServiceListCredentialGrantsResponse);
  rpc CreateInferencePolicy(AdminInferenceServiceCreateInferencePolicyRequest) returns (AdminInferenceServiceCreateInferencePolicyResponse);
  rpc ListInferencePolicies(AdminInferenceServiceListInferencePoliciesRequest) returns (AdminInferenceServiceListInferencePoliciesResponse);
  rpc SetModelEndpointEnabled(AdminInferenceServiceSetModelEndpointEnabledRequest) returns (AdminInferenceServiceSetModelEndpointEnabledResponse);
  rpc SetVectorStoreEnabled(AdminInferenceServiceSetVectorStoreEnabledRequest) returns (AdminInferenceServiceSetVectorStoreEnabledResponse);
  rpc SetModelEndpointCapabilityEnabled(AdminInferenceServiceSetModelEndpointCapabilityEnabledRequest) returns (AdminInferenceServiceSetModelEndpointCapabilityEnabledResponse);
  rpc SetCredentialStatus(AdminInferenceServiceSetCredentialStatusRequest) returns (AdminInferenceServiceSetCredentialStatusResponse);
  rpc ExpireCredentialGrant(AdminInferenceServiceExpireCredentialGrantRequest) returns (AdminInferenceServiceExpireCredentialGrantResponse);
  rpc ExpireInferencePolicy(AdminInferenceServiceExpireInferencePolicyRequest) returns (AdminInferenceServiceExpireInferencePolicyResponse);
  rpc DeleteModelEndpoint(AdminInferenceServiceDeleteModelEndpointRequest) returns (AdminInferenceServiceDeleteModelEndpointResponse);
  rpc DeleteModel(AdminInferenceServiceDeleteModelRequest) returns (AdminInferenceServiceDeleteModelResponse);
  rpc DeleteVectorStore(AdminInferenceServiceDeleteVectorStoreRequest) returns (AdminInferenceServiceDeleteVectorStoreResponse);
  rpc DeleteModelEndpointCapability(AdminInferenceServiceDeleteModelEndpointCapabilityRequest) returns (AdminInferenceServiceDeleteModelEndpointCapabilityResponse);
  rpc DeleteCredential(AdminInferenceServiceDeleteCredentialRequest) returns (AdminInferenceServiceDeleteCredentialResponse);
  rpc DeleteCredentialGrant(AdminInferenceServiceDeleteCredentialGrantRequest) returns (AdminInferenceServiceDeleteCredentialGrantResponse);
  rpc DeleteInferencePolicy(AdminInferenceServiceDeleteInferencePolicyRequest) returns (AdminInferenceServiceDeleteInferencePolicyResponse);
}

message AdminInferenceServiceApplyInferencePackageRequest {
  string name = 1;
  string version = 2;
  string source = 3;
  string checksum = 4;
  repeated ModelEndpoint model_endpoints = 5;
  repeated InferenceModel models = 6;
  repeated VectorStore vector_stores = 7;
  repeated ModelEndpointCapabilityDefinition model_endpoint_capabilities = 8;
}

message AdminInferenceServiceApplyInferencePackageResponse {
  InferencePackage package = 1;
  repeated ModelEndpoint model_endpoints = 2;
  repeated InferenceModel models = 3;
  repeated VectorStore vector_stores = 4;
  repeated ModelEndpointCapability model_endpoint_capabilities = 5;
}

message AdminInferenceServiceListInferencePackagesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message AdminInferenceServiceListInferencePackagesResponse {
  repeated InferencePackage packages = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceListModelEndpointsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
}

message AdminInferenceServiceListModelEndpointsResponse {
  repeated ModelEndpoint model_endpoints = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceListModelsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string operation = 3;
}

message AdminInferenceServiceListModelsResponse {
  repeated InferenceModel models = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceListVectorStoresRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool include_disabled = 3;
}

message AdminInferenceServiceListVectorStoresResponse {
  repeated VectorStore vector_stores = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceListModelEndpointCapabilitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string model_endpoint_id = 3;
  optional string model_id = 4;
  string operation = 5;
  bool include_disabled = 6;
}

message AdminInferenceServiceListModelEndpointCapabilitiesResponse {
  repeated ModelEndpointCapability model_endpoint_capabilities = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceCreateCredentialRequest {
  string key = 1;
  string display_name = 2;
  string model_endpoint = 3;
  string model_endpoint_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string auth_type = 7;
  oneof secret_material {
    InlineSecret inline_secret = 8;
    string external_ref = 9;
    string secret_value = 11;
  }
  bool is_default = 10;
}

message AdminInferenceServiceCreateCredentialResponse {
  Secret secret = 1;
  InferenceCredential credential = 2;
}

message AdminInferenceServiceListCredentialsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string owner_type = 3;
  string owner_id = 4;
  optional string model_endpoint_id = 5;
  bool include_inactive = 6;
}

message AdminInferenceServiceListCredentialsResponse {
  repeated InferenceCredential credentials = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceCreateCredentialGrantRequest {
  string space_id = 1;
  string credential = 2;
  string credential_id = 3;
  ProcessingScope scope = 4;
  repeated string operations = 5;
  string model_endpoint = 6;
  string model_endpoint_id = 7;
  string model = 8;
  string model_id = 9;
  int32 priority = 10;
  bool is_default = 11;
  bool allow_background_use = 12;
  google.protobuf.Timestamp expires_at = 13;
}

message AdminInferenceServiceCreateCredentialGrantResponse {
  CredentialGrant credential_grant = 1;
}

message AdminInferenceServiceListCredentialGrantsRequest {
  string space_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  optional string credential_id = 4;
  bool include_expired = 5;
}

message AdminInferenceServiceListCredentialGrantsResponse {
  repeated CredentialGrant credential_grants = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceCreateInferencePolicyRequest {
  string space_id = 1;
  ProcessingScope scope = 2;
  string effect = 3;
  repeated string operations = 4;
  bool no_inference = 5;
  repeated string allowed_privacy_classes = 6;
  bool disallow_third_party = 7;
  bool require_local_endpoint = 8;
  string reason = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message AdminInferenceServiceCreateInferencePolicyResponse {
  InferencePolicy inference_policy = 1;
}

message AdminInferenceServiceListInferencePoliciesRequest {
  string space_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string effect = 4;
  bool include_expired = 5;
}

message AdminInferenceServiceListInferencePoliciesResponse {
  repeated InferencePolicy inference_policies = 1;
  string next_page_token = 2;
}

message AdminInferenceServiceSetModelEndpointEnabledRequest {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
  bool enabled = 3;
}

message AdminInferenceServiceSetModelEndpointEnabledResponse {
  ModelEndpoint model_endpoint = 1;
}

message AdminInferenceServiceSetVectorStoreEnabledRequest {
  string vector_store = 1;
  string vector_store_id = 2;
  bool enabled = 3;
}

message AdminInferenceServiceSetVectorStoreEnabledResponse {
  VectorStore vector_store = 1;
}

message AdminInferenceServiceSetModelEndpointCapabilityEnabledRequest {
  string model_endpoint_capability_id = 1;
  string model_endpoint = 2;
  string model_endpoint_id = 3;
  string model = 4;
  string model_id = 5;
  string operation = 6;
  bool enabled = 7;
}

message AdminInferenceServiceSetModelEndpointCapabilityEnabledResponse {
  ModelEndpointCapability model_endpoint_capability = 1;
}

message AdminInferenceServiceSetCredentialStatusRequest {
  string credential = 1;
  string credential_id = 2;
  string status = 3;
}

message AdminInferenceServiceSetCredentialStatusResponse {
  InferenceCredential credential = 1;
}

message AdminInferenceServiceExpireCredentialGrantRequest {
  string space_id = 1;
  string credential_grant_id = 2;
}

message AdminInferenceServiceExpireCredentialGrantResponse {
  CredentialGrant credential_grant = 1;
}

message AdminInferenceServiceExpireInferencePolicyRequest {
  string space_id = 1;
  string inference_policy_id = 2;
}

message AdminInferenceServiceExpireInferencePolicyResponse {
  InferencePolicy inference_policy = 1;
}

message AdminInferenceServiceDeleteModelEndpointRequest {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
}

message AdminInferenceServiceDeleteModelEndpointResponse {
  string model_endpoint_id = 1;
}

message AdminInferenceServiceDeleteModelRequest {
  string model = 1;
  string model_id = 2;
}

message AdminInferenceServiceDeleteModelResponse {
  string model_id = 1;
}

message AdminInferenceServiceDeleteVectorStoreRequest {
  string vector_store = 1;
  string vector_store_id = 2;
}

message AdminInferenceServiceDeleteVectorStoreResponse {
  string vector_store_id = 1;
}

message AdminInferenceServiceDeleteModelEndpointCapabilityRequest {
  string model_endpoint_capability_id = 1;
}

message AdminInferenceServiceDeleteModelEndpointCapabilityResponse {
  string model_endpoint_capability_id = 1;
}

message AdminInferenceServiceDeleteCredentialRequest {
  string credential = 1;
  string credential_id = 2;
  bool delete_grants = 3;
  bool delete_secret = 4;
}

message AdminInferenceServiceDeleteCredentialResponse {
  string credential_id = 1;
  int32 credential_grants_deleted = 2;
  bool secret_deleted = 3;
}

message AdminInferenceServiceDeleteCredentialGrantRequest {
  string space_id = 1;
  string credential_grant_id = 2;
}

message AdminInferenceServiceDeleteCredentialGrantResponse {
  string credential_grant_id = 1;
}

message AdminInferenceServiceDeleteInferencePolicyRequest {
  string space_id = 1;
  string inference_policy_id = 2;
}

message AdminInferenceServiceDeleteInferencePolicyResponse {
  string inference_policy_id = 1;
}

message InferencePackage {
  string inference_package_id = 1;
  string name = 2;
  string version = 3;
  string source = 4;
  string checksum = 5;
  map<string, int32> definition_counts = 6;
  google.protobuf.Timestamp installed_at = 7;
  string installed_by = 8;
}

message ModelEndpoint {
  string model_endpoint_id = 1;
  string key = 2;
  string name = 3;
  string connector_type = 4;
  string endpoint_url = 5;
  string network_class = 6;
  string privacy_class = 7;
  repeated string auth_modes = 8;
  repeated string operations = 9;
  bool enabled = 10;
  google.protobuf.Struct metadata = 11;
}

message InferenceModel {
  string model_id = 1;
  string key = 2;
  string operation = 3;
  string model_name = 4;
  repeated string connector_types = 5;
  int32 dimensions = 6;
  string modality = 7;
  string vector_space_key = 8;
  google.protobuf.Struct metadata = 9;
}

message VectorStore {
  string vector_store_id = 1;
  string key = 2;
  string name = 3;
  string type = 4;
  string privacy_class = 5;
  bool enabled = 6;
  google.protobuf.Struct config = 7;
}

message ModelEndpointCapability {
  string model_endpoint_capability_id = 1;
  string model_endpoint_id = 2;
  string model_id = 3;
  string operation = 4;
  bool enabled = 5;
  string model_name_override = 6;
  google.protobuf.Struct metadata = 7;
}

message ModelEndpointCapabilityDefinition {
  string model_endpoint = 1;
  string model_endpoint_id = 2;
  string model = 3;
  string model_id = 4;
  string operation = 5;
  optional bool enabled = 6;
  string model_name_override = 7;
  google.protobuf.Struct metadata = 8;
}

message InlineSecret {
  string algorithm = 1;
  string nonce_b64 = 2;
  string cipher_b64 = 3;
}

message Secret {
  string secret_id = 1;
  string owner_type = 2;
  string owner_id = 3;
  string kind = 4;
  InlineSecret inline_secret = 5;
  string external_ref = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

message InferenceCredential {
  string credential_id = 1;
  string key = 2;
  string display_name = 3;
  string model_endpoint_id = 4;
  string owner_type = 5;
  string owner_id = 6;
  string auth_type = 7;
  string secret_id = 8;
  string status = 9;
  bool is_default = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
  google.protobuf.Timestamp last_used_time = 13;
}

message ProcessingScope {
  string space_id = 1;
  string domain_id = 2;
  string semantic_index_id = 3;
  string node_id = 4;
  bool include_descendants = 5;
}

message CredentialGrant {
  string credential_grant_id = 1;
  string credential_id = 2;
  ProcessingScope scope = 3;
  repeated string operations = 4;
  string model_endpoint_id = 5;
  string model_id = 6;
  int32 priority = 7;
  bool is_default = 8;
  bool allow_background_use = 9;
  string granted_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp expire_time = 12;
}

message InferencePolicy {
  string inference_policy_id = 1;
  ProcessingScope scope = 2;
  string effect = 3;
  repeated string operations = 4;
  bool no_inference = 5;
  repeated string allowed_privacy_classes = 6;
  bool disallow_third_party = 7;
  bool require_local_endpoint = 8;
  string reason = 9;
  string created_by = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp expire_time = 12;
}
