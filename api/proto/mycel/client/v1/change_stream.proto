syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/timestamp.proto";
import "mycel/client/v1/graph.proto";


// ChangeStreamService streams committed domain changes to clients/connectors.
// It does not stream uncommitted transaction operations.
service ChangeStreamService {
  // WatchDomainChanges watches committed graph changes for one space/domain.
  rpc WatchDomainChanges(WatchDomainChangesRequest) returns (stream WatchDomainChangesResponse);
}

message WatchDomainChangesRequest {
  string space_id = 1;
  string domain_id = 2;

  // Optional resume position. When set, the daemon streams changes after this
  // domain revision. If the revision is no longer available, the daemon should
  // return OUT_OF_RANGE so the connector can resync.
  optional int64 after_revision = 3;

  // When true, the daemon should first send a checkpoint containing the current
  // observed domain revision.
  bool include_current = 4;

  // Optional event filters. Empty means all supported event types.
  repeated ChangeEventType event_types = 5;
}

message WatchDomainChangesResponse {
  oneof message {
    ChangeCheckpoint checkpoint = 1;
    ChangeEvent event = 2;
    ChangeStreamHeartbeat heartbeat = 3;
  }
}

message ChangeCheckpoint {
  string space_id = 1;
  string domain_id = 2;
  int64 current_revision = 3;
  google.protobuf.Timestamp checkpoint_time = 4;
}

message ChangeStreamHeartbeat {
  google.protobuf.Timestamp heartbeat_time = 1;
}

// ChangeEvent describes one committed transaction/revision event. The event may
// contain multiple graph changes from the same commit.
message ChangeEvent {
  string event_id = 1;
  string space_id = 2;
  string domain_id = 3;
  int64 revision = 4;
  string commit_id = 5;
  google.protobuf.Timestamp event_time = 6;
  repeated GraphChange changes = 7;
}

message GraphChange {
  ChangeEventType type = 1;

  oneof subject {
    // Create/update events should include the full payload where practical.
    Node node = 2;
    Edge edge = 3;

    // Delete events use ids because the object no longer exists in the current
    // graph state.
    string node_id = 4;
    string edge_id = 5;
  }
}

enum ChangeEventType {
  CHANGE_EVENT_TYPE_UNSPECIFIED = 0;
  CHANGE_EVENT_TYPE_NODE_CREATED = 1;
  CHANGE_EVENT_TYPE_NODE_UPDATED = 2;
  CHANGE_EVENT_TYPE_NODE_DELETED = 3;
  CHANGE_EVENT_TYPE_EDGE_CREATED = 4;
  CHANGE_EVENT_TYPE_EDGE_UPDATED = 5;
  CHANGE_EVENT_TYPE_EDGE_DELETED = 6;
  CHANGE_EVENT_TYPE_REVISION_ADVANCED = 7;
}
