syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/timestamp.proto";


// BlobService manages raw blob content and blob metadata. It does not mutate the
// graph. Blob-backed node creation belongs to GraphService because it creates a
// graph node inside a transaction.
service BlobService {
  // UploadBlob uploads raw blob content. The first message should contain
  // metadata, followed by one or more chunk messages.
  rpc UploadBlob(stream UploadBlobRequest) returns (UploadBlobResponse);

  // DownloadBlob downloads raw blob content. The response stream should include
  // metadata followed by content chunks.
  rpc DownloadBlob(DownloadBlobRequest) returns (stream DownloadBlobResponse);

  // GetBlob returns blob metadata only.
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);

  // DeleteBlob deletes an unreferenced blob. Referenced blobs must not be
  // deleted directly.
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);
}

message UploadBlobRequest {
  oneof part {
    UploadBlobMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadBlobMetadata {
  string space_id = 1;
  string declared_mime_type = 2;
  string original_filename = 3;
}

message UploadBlobResponse {
  Blob blob = 1;
}

message DownloadBlobRequest {
  string space_id = 1;
  string blob_id = 2;
}

message DownloadBlobResponse {
  oneof part {
    Blob blob = 1;
    bytes chunk = 2;
  }
}

message GetBlobRequest {
  string space_id = 1;
  string blob_id = 2;
}

message GetBlobResponse {
  Blob blob = 1;
}

message DeleteBlobRequest {
  string space_id = 1;
  string blob_id = 2;
}

message DeleteBlobResponse {
  string deleted_blob_id = 1;
}

// Blob is the client-visible metadata for content-addressed blob data.
message Blob {
  string blob_id = 1;
  string space_id = 2;

  // Content digest, for example sha256:<hex>. The exact digest algorithm is
  // daemon-defined but should be stable enough for deduplication and integrity
  // checks.
  string digest = 3;

  int64 size_bytes = 4;

  // Authoritative MIME type determined by the daemon when possible.
  string mime_type = 5;

  // Client-declared MIME type, if supplied.
  string declared_mime_type = 6;

  string original_filename = 7;
  google.protobuf.Timestamp create_time = 8;
}
