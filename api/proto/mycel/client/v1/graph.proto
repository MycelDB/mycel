syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mycel/client/v1/blob.proto";


// GraphService provides transaction-scoped graph node and edge operations.
// Every request targets transaction_id; sessions and transactions are managed by
// SessionService and TransactionService.
service GraphService {
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc CreateBlobNode(stream CreateBlobNodeRequest) returns (CreateBlobNodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  rpc UpsertNode(UpsertNodeRequest) returns (UpsertNodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);

  rpc GetEdge(GetEdgeRequest) returns (GetEdgeResponse);
  rpc ListEdges(ListEdgesRequest) returns (ListEdgesResponse);
  rpc CreateEdge(CreateEdgeRequest) returns (CreateEdgeResponse);
  rpc UpdateEdge(UpdateEdgeRequest) returns (UpdateEdgeResponse);
  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse);

  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
  rpc GetParent(GetParentRequest) returns (GetParentResponse);
  rpc MoveSubtree(MoveSubtreeRequest) returns (MoveSubtreeResponse);
  rpc ReorderChildren(ReorderChildrenRequest) returns (ReorderChildrenResponse);

  rpc ApplyGraphOperations(ApplyGraphOperationsRequest) returns (ApplyGraphOperationsResponse);
}

message GetNodeRequest {
  string transaction_id = 1;
  string node_id = 2;
}

message GetNodeResponse {
  Node node = 1;
}

message ListNodesRequest {
  string transaction_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  string next_page_token = 2;
}

message CreateNodeRequest {
  string transaction_id = 1;
  NodeCreate node = 2;
}

message CreateNodeResponse {
  Node node = 1;
}

message CreateBlobNodeRequest {
  oneof part {
    CreateBlobNodeMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message CreateBlobNodeMetadata {
  string transaction_id = 1;

  // Optional client-supplied node id. If omitted, the daemon allocates one.
  optional string node_id = 2;
  string declared_mime_type = 4;
  string original_filename = 5;
  repeated string labels = 6;
  google.protobuf.Struct properties = 7;
  google.protobuf.Struct payload = 8;
  google.protobuf.Struct meta = 9;
}

message CreateBlobNodeResponse {
  Node node = 1;
  Blob blob = 2;
}

message UpdateNodeRequest {
  string transaction_id = 1;
  Node node = 2;

  // Mutable paths currently include "labels", "properties", "payload", and system-allowed "meta" fields.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateNodeResponse {
  Node node = 1;
}

message UpsertNodeRequest {
  string transaction_id = 1;
  NodeCreate node = 2;
}

message UpsertNodeResponse {
  Node node = 1;
}

message DeleteNodeRequest {
  string transaction_id = 1;
  string node_id = 2;

  // When true, delete the node subtree/content according to daemon graph rules.
  bool recursive = 3;
}

message DeleteNodeResponse {
  repeated string deleted_node_ids = 1;
  repeated string deleted_edge_ids = 2;
}

message GetEdgeRequest {
  string transaction_id = 1;
  string edge_id = 2;
}

message GetEdgeResponse {
  Edge edge = 1;
}

message ListEdgesRequest {
  string transaction_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListEdgesResponse {
  repeated Edge edges = 1;
  string next_page_token = 2;
}

message CreateEdgeRequest {
  string transaction_id = 1;
  EdgeCreate edge = 2;
}

message CreateEdgeResponse {
  Edge edge = 1;
}

message UpdateEdgeRequest {
  string transaction_id = 1;
  Edge edge = 2;

  // Mutable paths currently include "kind" and "props".
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateEdgeResponse {
  Edge edge = 1;
}

message DeleteEdgeRequest {
  string transaction_id = 1;
  string edge_id = 2;
}

message DeleteEdgeResponse {
  string deleted_edge_id = 1;
}

message ListChildrenRequest {
  string transaction_id = 1;
  string parent_node_id = 2;
}

message ListChildrenResponse {
  // Contains edges from the parent to its children, ordered according to the
  // domain/template child ordering policy.
  repeated Edge contains_edges = 1;
}

message GetParentRequest {
  string transaction_id = 1;
  string child_node_id = 2;
}

message GetParentResponse {
  // Empty when the node has no parent contains edge.
  optional Edge contains_edge = 1;
}

message MoveSubtreeRequest {
  string transaction_id = 1;
  string node_id = 2;
  string new_parent_node_id = 3;

  // Optional target order value for implementations that store ordering on the
  // contains edge. If omitted, the daemon appends according to policy.
  optional int32 order = 4;
}

message MoveSubtreeResponse {
  Edge contains_edge = 1;
}

message ReorderChildrenRequest {
  string transaction_id = 1;
  string parent_node_id = 2;

  // Complete ordered child id list for the parent.
  repeated string child_node_ids = 3;
}

message ReorderChildrenResponse {
  repeated Edge contains_edges = 1;
}

message ApplyGraphOperationsRequest {
  string transaction_id = 1;

  // Operations are applied in order inside the transaction. Transaction commit
  // remains the durability/atomicity boundary.
  repeated GraphOperation operations = 2;
}

message ApplyGraphOperationsResponse {
  repeated GraphOperationResult results = 1;
}

// Node is the client-visible graph node representation.
message Node {
  string node_id = 1;
  string domain_id = 2;
  repeated string labels = 4;
  google.protobuf.Struct properties = 5;
  google.protobuf.Struct payload = 6;
  google.protobuf.Struct meta = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
}

// NodeCreate is the payload used to create or upsert a node.
message NodeCreate {
  // Optional client-supplied id. If omitted, the daemon allocates one.
  optional string node_id = 1;
  repeated string labels = 3;
  google.protobuf.Struct properties = 4;
  google.protobuf.Struct payload = 5;
  google.protobuf.Struct meta = 6;
}

// Edge is the client-visible graph edge representation.
message Edge {
  string edge_id = 1;
  string domain_id = 2;
  string from_node_id = 3;
  string to_node_id = 4;
  repeated string labels = 5;
  google.protobuf.Struct properties = 6;
  google.protobuf.Struct payload = 7;
  google.protobuf.Struct meta = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
}

// EdgeCreate is the payload used to create an edge.
message EdgeCreate {
  // Optional client-supplied id. If omitted, the daemon allocates one.
  optional string edge_id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  repeated string labels = 4;
  google.protobuf.Struct properties = 5;
  google.protobuf.Struct payload = 6;
  google.protobuf.Struct meta = 7;
}

message GraphOperation {
  oneof operation {
    NodeCreate create_node = 1;
    NodeUpdate update_node = 2;
    NodeUpsert upsert_node = 3;
    NodeDelete delete_node = 4;
    EdgeCreate create_edge = 5;
    EdgeUpdate update_edge = 6;
    EdgeDelete delete_edge = 7;
    SubtreeMove move_subtree = 8;
    ChildrenReorder reorder_children = 9;
  }
}

message GraphOperationResult {
  oneof result {
    Node created_node = 1;
    Node updated_node = 2;
    Node upserted_node = 3;
    NodeDeleteResult deleted_node = 4;
    Edge created_edge = 5;
    Edge updated_edge = 6;
    EdgeDeleteResult deleted_edge = 7;
    Edge moved_subtree_edge = 8;
    ChildrenReorderResult reordered_children = 9;
  }
}

message NodeUpdate {
  Node node = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message NodeUpsert {
  NodeCreate node = 1;
}

message NodeDelete {
  string node_id = 1;
  bool recursive = 2;
}

message NodeDeleteResult {
  repeated string deleted_node_ids = 1;
  repeated string deleted_edge_ids = 2;
}

message EdgeUpdate {
  Edge edge = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message EdgeDelete {
  string edge_id = 1;
}

message EdgeDeleteResult {
  string deleted_edge_id = 1;
}

message SubtreeMove {
  string node_id = 1;
  string new_parent_node_id = 2;
  optional int32 order = 3;
}

message ChildrenReorder {
  string parent_node_id = 1;
  repeated string child_node_ids = 2;
}

message ChildrenReorderResult {
  repeated Edge contains_edges = 1;
}
