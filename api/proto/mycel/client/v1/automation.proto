syntax = "proto3";

package mycel.client.v1;

// AutomationService manages domain-scoped graph automation definitions and run history.
service AutomationService {
  rpc ValidateAutomation(ValidateAutomationRequest) returns (ValidateAutomationResponse);
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (UpdateAutomationResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc GetAutomation(GetAutomationRequest) returns (GetAutomationResponse);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc EnableAutomation(EnableAutomationRequest) returns (EnableAutomationResponse);
  rpc DisableAutomation(DisableAutomationRequest) returns (DisableAutomationResponse);
  rpc ListAutomationInvocations(ListAutomationInvocationsRequest) returns (ListAutomationInvocationsResponse);
  rpc GetAutomationRun(GetAutomationRunRequest) returns (GetAutomationRunResponse);
  rpc RetryAutomationInvocation(RetryAutomationInvocationRequest) returns (RetryAutomationInvocationResponse);
  rpc CancelAutomationInvocation(CancelAutomationInvocationRequest) returns (CancelAutomationInvocationResponse);
}

message ValidateAutomationRequest {
  string domain_id = 1;
  string definition_json = 2;
}

message ValidateAutomationResponse {
  bool valid = 1;
  string error = 2;
  string normalized_definition_json = 3;
}

message CreateAutomationRequest {
  string domain_id = 1;
  string definition_json = 2;
}

message UpdateAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
  string definition_json = 3;
}

message DeleteAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message DeleteAutomationResponse {}

message GetAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message ListAutomationsRequest {
  string domain_id = 1;
  string status = 2;
}

message ListAutomationsResponse {
  repeated AutomationDefinitionSummary automations = 1;
}

message EnableAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message DisableAutomationRequest {
  string domain_id = 1;
  string automation_id = 2;
}

message CreateAutomationResponse {
  string definition_json = 1;
}

message UpdateAutomationResponse {
  string definition_json = 1;
}

message GetAutomationResponse {
  string definition_json = 1;
}

message EnableAutomationResponse {
  string definition_json = 1;
}

message DisableAutomationResponse {
  string definition_json = 1;
}

message AutomationDefinitionSummary {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string status = 4;
  repeated string events = 5;
  repeated string labels = 6;
  string updated_at = 7;
}

message ListAutomationInvocationsRequest {
  string domain_id = 1;
  string automation_id = 2;
  string status = 3;
  int32 limit = 4;
}

message ListAutomationInvocationsResponse {
  repeated AutomationInvocationSummary invocations = 1;
}

message AutomationInvocationSummary {
  string id = 1;
  string automation_id = 2;
  int32 automation_version = 3;
  string event_id = 4;
  string changed_element_id = 5;
  string event_type = 6;
  string status = 7;
  string skip_reason = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetAutomationRunRequest {
  string domain_id = 1;
  string run_id = 2;
}

message GetAutomationRunResponse {
  string run_json = 1;
}

message RetryAutomationInvocationRequest {
  string domain_id = 1;
  string invocation_id = 2;
}

message RetryAutomationInvocationResponse {
  AutomationInvocationSummary invocation = 1;
}

message CancelAutomationInvocationRequest {
  string domain_id = 1;
  string invocation_id = 2;
}

message CancelAutomationInvocationResponse {
  AutomationInvocationSummary invocation = 1;
}
