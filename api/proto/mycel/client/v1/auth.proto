syntax = "proto3";

package mycel.client.v1;

import "google/protobuf/timestamp.proto";


// AuthService manages client authentication and durable auth sessions.
//
// Auth sessions are distinct from graph sessions. Auth sessions identify a
// user/client and issue access tokens. Graph sessions are daemon-owned
// transactional contexts used by graph APIs.
service AuthService {
  // Login authenticates a user and creates a durable auth session.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh rotates a refresh token/session and returns a new short-lived
  // access token. Browser transports may carry the refresh token in an
  // HttpOnly cookie and omit refresh_token from the request body.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes the current auth session, or the supplied session when the
  // caller is authorized to revoke it.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // WhoAmI returns the identity associated with the current access token.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // ListAuthSessions lists the caller's durable auth sessions.
  rpc ListAuthSessions(ListAuthSessionsRequest) returns (ListAuthSessionsResponse);

  // RevokeAuthSession revokes one of the caller's durable auth sessions.
  rpc RevokeAuthSession(RevokeAuthSessionRequest) returns (RevokeAuthSessionResponse);

  // RevokeOtherAuthSessions revokes all of the caller's durable auth sessions
  // except the current one.
  rpc RevokeOtherAuthSessions(RevokeOtherAuthSessionsRequest) returns (RevokeOtherAuthSessionsResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  ClientInfo client = 3;
}

message LoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
  AuthPrincipal principal = 3;

  // Optional for non-browser connectors. Browser transports should prefer an
  // HttpOnly refresh cookie set by the HTTP layer.
  optional string refresh_token = 4;
}

message RefreshRequest {
  // Optional because browser transports may provide the refresh token via an
  // HttpOnly cookie.
  optional string refresh_token = 1;
  ClientInfo client = 2;
}

message RefreshResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
  AuthPrincipal principal = 3;

  // Optional for non-browser connectors. Browser transports should prefer an
  // HttpOnly refresh cookie set by the HTTP layer.
  optional string refresh_token = 4;
}

message LogoutRequest {
  // If omitted, the daemon revokes the current auth session from request
  // context, refresh-token context, or cookie context.
  optional string auth_session_id = 1;
}

message LogoutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  AuthPrincipal principal = 1;
}

message ListAuthSessionsRequest {
  // Maximum number of sessions to return. The daemon may cap this value.
  int32 page_size = 1;

  // Opaque continuation token returned by a previous list call.
  string page_token = 2;

  // Include expired or revoked sessions when true. The default is active
  // sessions only.
  bool include_inactive = 3;
}

message ListAuthSessionsResponse {
  repeated AuthSessionSummary sessions = 1;
  string next_page_token = 2;
}

message RevokeAuthSessionRequest {
  string auth_session_id = 1;
}

message RevokeAuthSessionResponse {}

message RevokeOtherAuthSessionsRequest {}

message RevokeOtherAuthSessionsResponse {
  int32 revoked_count = 1;
}

message AuthPrincipal {
  string user_id = 1;
  string username = 2;
}

message AuthSessionSummary {
  string auth_session_id = 1;
  google.protobuf.Timestamp create_time = 2;
  google.protobuf.Timestamp last_seen_time = 3;
  google.protobuf.Timestamp expire_time = 4;
  bool current = 5;
  ClientInfo client = 6;
  AuthSessionState state = 7;
}

message ClientInfo {
  // Human-readable client/application name, for example "knot-pkm-client" or
  // "mycel-cli".
  string name = 1;

  // Client/application version when known.
  string version = 2;

  // Coarse platform label, for example "web", "go", "cli", "mobile", or
  // "server".
  string platform = 3;

  // Optional user-visible device/session label. This is client supplied and
  // should not be used for security decisions.
  string device_label = 4;
}

enum AuthSessionState {
  AUTH_SESSION_STATE_UNSPECIFIED = 0;
  AUTH_SESSION_STATE_ACTIVE = 1;
  AUTH_SESSION_STATE_EXPIRED = 2;
  AUTH_SESSION_STATE_REVOKED = 3;
}
