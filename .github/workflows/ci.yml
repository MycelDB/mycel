name: CI

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout daemon
        uses: actions/checkout@v4
        with:
          path: mycel

      - name: Checkout API protos at matching ref
        id: checkout-api
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: MycelDB/mycel-api
          ref: ${{ github.ref_type == 'tag' && github.ref_name || (github.head_ref || github.ref_name) }}
          path: mycel-api
          token: ${{ secrets.MYCELDB_GITHUB_TOKEN || github.token }}

      - name: Remove incomplete API checkout
        if: steps.checkout-api.outcome == 'failure'
        run: rm -rf mycel-api

      - name: Checkout API protos at develop fallback
        if: steps.checkout-api.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-api
          ref: develop
          path: mycel-api
          token: ${{ secrets.MYCELDB_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: mycel/go.mod
          cache-dependency-path: mycel/go.sum

      - name: Test
        working-directory: mycel
        run: make test

      - name: Build
        working-directory: mycel
        run: make build

      - name: Public surface check
        working-directory: mycel
        run: scripts/check-public-surface.sh --workspace "$GITHUB_WORKSPACE" --strict
