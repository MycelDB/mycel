name: Validate PR source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop or hotfix source for main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::Pull requests to main must come from branches in $BASE_REPO, not $HEAD_REPO. Please target develop for external contributions."
            exit 1
          fi

          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then
            echo "main PR source accepted: $HEAD_REF"
            exit 0
          fi

          echo "::error::main accepts pull requests only from develop or hotfix/* branches; got '$HEAD_REF'."
          exit 1
