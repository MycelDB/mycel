name: Publish accepted Docker image

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Existing stable Git tag to publish, for example v0.26.0'
        required: true
        type: string
      accepted_image:
        description: 'Accepted docker.io/myceldb/mycel image pinned by index digest'
        required: true
        type: string
      release_manifest_sha256:
        description: 'SHA-256 of the reviewed coordinated release manifest'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stable-docker-image
  cancel-in-progress: false

jobs:
  dockerhub:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      ACCEPTED_IMAGE: ${{ inputs.accepted_image }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
    steps:
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ACCEPTED_IMAGE" =~ ^docker\.io/myceldb/mycel@sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]

      - name: Check out the tagged daemon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          path: mycel
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main and resolve API pin
        working-directory: mycel
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse --verify "refs/tags/${RELEASE_REF}^{commit}")" = "$(git rev-parse HEAD)"
          api_ref=$(tr -d '[:space:]' < .release/mycel-api-ref)
          [[ "$api_ref" =~ ^[a-f0-9]{40}$ ]]
          echo "API_REF=$api_ref" >> "$GITHUB_ENV"

      - name: Check out the pinned API
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: MycelDB/mycel-api
          ref: ${{ env.API_REF }}
          path: mycel-api
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote the accepted index without rebuilding
        run: |
          set -euo pipefail
          test "$(git -C mycel-api rev-parse HEAD)" = "$API_REF"
          test -z "$(git -C mycel status --porcelain)"
          test -z "$(git -C mycel-api status --porcelain)"
          daemon_revision=$(git -C mycel rev-parse HEAD)
          context_digest=$({ echo '[mycel]'; git -C mycel ls-files -s; echo '[mycel-api]'; git -C mycel-api ls-files -s; } | sha256sum | awk '{print $1}')
          bash mycel/scripts/promoteAcceptedDockerImage.sh "$RELEASE_REF" "$ACCEPTED_IMAGE" "$daemon_revision" "$context_digest"
          printf 'Release manifest: `%s`\n\nPublished: `docker.io/myceldb/mycel:%s` from `%s`\n' \
            "$RELEASE_MANIFEST_SHA256" "$RELEASE_REF" "$ACCEPTED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
