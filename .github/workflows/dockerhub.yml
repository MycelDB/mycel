name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout daemon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: mycel
          fetch-depth: 0

      - name: Checkout API protos at matching release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MycelDB/mycel-api
          ref: ${{ github.ref_name }}
          path: mycel-api

      - name: Verify tag is on main
        working-directory: mycel
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write Docker build context ignore
        run: |
          cat > .dockerignore <<'EOF'
          **/.git
          **/bin
          **/coverage
          **/coverage.out
          **/data
          **/node_modules
          **/target
          EOF

      - name: Build and push mycel image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: mycel/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            myceldb/mycel:${{ github.ref_name }}
            myceldb/mycel:latest
