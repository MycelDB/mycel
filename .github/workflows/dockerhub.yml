name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout daemon
        uses: actions/checkout@v4
        with:
          path: mycel
          fetch-depth: 0

      - name: Checkout API protos
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-api
          ref: ${{ github.ref_name }}
          path: mycel-api
          # GITHUB_TOKEN is scoped to this repository and cannot read sibling
          # private repos. Use a fine-grained PAT with read-only Contents access
          # to MycelDB/mycel-api while the API repo remains private.
          token: ${{ secrets.MYCELDB_GITHUB_TOKEN }}

      - name: Verify tag is on main
        working-directory: mycel
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mycel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mycel/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            myceldb/mycel:${{ github.ref_name }}
            myceldb/mycel:latest
