name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Release tag/ref to publish, for example v0.17.0'
        required: true
        type: string
      api_ref:
        description: 'Optional mycel-api ref override. Defaults to .release/mycel-api-ref from the daemon release ref.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
      API_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.api_ref || '' }}
    steps:
      - name: Checkout daemon
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REF }}
          path: mycel
          fetch-depth: 0

      - name: Resolve compatible API ref
        working-directory: mycel
        run: |
          api_ref="${API_REF_INPUT}"
          if [ -z "$api_ref" ]; then
            if [ ! -s .release/mycel-api-ref ]; then
              echo ".release/mycel-api-ref is required when api_ref is not provided" >&2
              exit 1
            fi
            api_ref="$(tr -d '[:space:]' < .release/mycel-api-ref)"
          fi
          if [ -z "$api_ref" ]; then
            echo "resolved API ref is empty" >&2
            exit 1
          fi
          echo "API_REF=$api_ref" >> "$GITHUB_ENV"
          echo "Using MycelDB/mycel-api@$api_ref"

      - name: Checkout API protos at compatible release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MycelDB/mycel-api
          ref: ${{ env.API_REF }}
          path: mycel-api

      - name: Verify release ref is on main
        working-directory: mycel
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write Docker build context ignore
        run: |
          cat > .dockerignore <<'EOF'
          **/.git
          **/bin
          **/coverage
          **/coverage.out
          **/data
          **/node_modules
          **/target
          EOF

      - name: Build and push mycel image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: mycel/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            myceldb/mycel:${{ env.RELEASE_REF }}
            myceldb/mycel:latest
