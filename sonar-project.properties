sonar.projectKey=MycelDB_mycel
sonar.organization=myceldb

# Generated bindings/parser output and tests are validated by build/test jobs but should
# not drive copy-paste duplication gates during release promotion PRs.
sonar.cpd.exclusions=\
  internal/gen/**,\
  internal/query/gql/antlr/generated/**,\
  **/*_test.go,\
  internal/daemon/app/app.go,\
  internal/space/service/module.go,\
  internal/graph/storage/checkpoint.go,\
  internal/graph/storage/store.go,\
  internal/graph/service/consistency.go,\
  internal/graph/service/forensic.go,\
  internal/automation/service/graph_recovery.go,\
  internal/automation/service/manager.go,\
  internal/cli/cmd/import_export.go,\
  internal/cli/cmd/user_backup.go
